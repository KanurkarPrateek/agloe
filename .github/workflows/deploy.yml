# Build the image on every push/PR; on main, push it to GHCR and roll it out to k8s.
#
# Repo secret (Settings → Secrets and variables → Actions):
#   KUBE_CONFIG  base64 kubeconfig for the namespaced deployer in k8s/setup/deployer.yaml
# Without it the deploy job is skipped and only the image is published.
# The app's signing key is NOT stored in GitHub; it lives only in the cluster
# (secret `agloe` in namespace `agloe`, created once by hand).
name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        id: image
        run: |
          name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Check cluster access is configured
        id: gate
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::notice::KUBE_CONFIG secret not set — image published, deploy skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-kubectl@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Write kubeconfig
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client
          kubectl config current-context

      - name: Apply manifests with this build's image
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sed "s|image: agloe:latest.*|image: ${IMAGE}|" k8s/agloe.yaml > /tmp/agloe.yaml
          grep -n "image:" /tmp/agloe.yaml
          kubectl apply -f /tmp/agloe.yaml

      - name: Wait for rollout
        if: steps.gate.outputs.enabled == 'true'
        run: |
          kubectl -n agloe rollout status deployment/agloe --timeout=180s
          kubectl -n agloe get pods,svc,ingress -o wide
          host=$(kubectl -n agloe get ingress agloe -o jsonpath='{.spec.rules[0].host}')
          {
            echo "### Agloe deployed"
            echo "Image: \`${IMAGE}\`"
            echo "Live: https://$host"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live site
        if: steps.gate.outputs.enabled == 'true'
        run: |
          host=$(kubectl -n agloe get ingress agloe -o jsonpath='{.spec.rules[1].host}')
          ip=$(kubectl -n agloe get ingress agloe -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          # Go straight to the ingress IP so the check doesn't depend on public DNS.
          resolve=()
          if [ -n "$ip" ]; then resolve=(--resolve "$host:443:$ip"); fi
          failed=0
          for route in / /console /api/traps; do
            code=000
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "${resolve[@]}" "https://$host$route" || true)
              if [ "$code" = "200" ]; then break; fi
              echo "  attempt $attempt: https://$host$route → $code"
              sleep 5
            done
            echo "https://$host$route → $code"
            if [ "$code" != "200" ]; then failed=1; fi
          done
          exit "$failed"
